services:
  - type: web
    name: StatusC0rd
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Everything below is optional: the dashboard stores the same values in
      # data/settings.json, and variables win when both exist - they are the
      # only thing that survives this plan, which wipes the disk on restart.
      # Step by step: SETUP.md, section 1.
      # Your own Discord application ID. Leave blank to enter it in the dashboard.
      - key: CLIENT_ID
        sync: false
      - key: DISCORD_TOKEN
        sync: false
      - key: DASHBOARD_KEY
        sync: false
      - key: CLIENT_SECRET
        sync: false
      - key: ALLOWED_DISCORD_IDS
        sync: false
      - key: SESSION_SECRET
        sync: false
      # The name in the header and titles. Blank means "StatusC0rd".
      - key: SITE_NAME
        sync: false
      # Leave blank: Render publishes the service's own URL as RENDER_EXTERNAL_URL
      # and the app uses it for photo links, the keep-alive and the card page.
      # Set this only for a custom domain.
      - key: PUBLIC_URL
        sync: false
      # Keeps the free service awake, which is what keeps the bot online.
      - key: KEEP_ALIVE
        value: "true"
      - key: KEEP_ALIVE_INTERVAL_MINUTES
        value: "10"
