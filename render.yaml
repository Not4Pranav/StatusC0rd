services:
  - type: web
    name: StatusC0rd
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Everything below is optional: the setup wizard stores the same values in
      # data/settings.json. Variables win when both are present - and they are the
      # only thing that survives this plan, which wipes the disk on every restart.
      # Set these four (plus DISCORD_TOKEN) and a wiped instance comes back
      # configured. Full walkthrough: SETUP.md, Part 2.
      # Your own Discord application ID. Leave blank to enter it in the wizard.
      - key: CLIENT_ID
        sync: false
      - key: DISCORD_TOKEN
        sync: false
      - key: DASHBOARD_KEY
        sync: false
      - key: CLIENT_SECRET
        sync: false
      - key: ALLOWED_DISCORD_IDS
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SETUP_TOKEN
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: REDIRECT_URI
        sync: false
      # Keeps the free service awake, which is what keeps the bot online.
      # Needs PUBLIC_URL to be set and reachable from the internet.
      - key: KEEP_ALIVE
        value: "true"
      - key: KEEP_ALIVE_INTERVAL_MINUTES
        value: "10"
      # Split hosting (SETUP.md 6.5): set BOT_WORKER_TOKEN here and run the bot
      # on another box with BOT_WORKER=1, BOT_URL=<this service's URL> and the
      # same token. Leave it empty to keep the bot in this process.
      - key: BOT_WORKER_TOKEN
        sync: false

  # Uncomment to run the bot on Render too, as its own always-warm service.
  # Two free services are allowed per account; the worker needs no disk.
  # - type: worker
  #   name: StatusC0rd-bot
  #   runtime: node
  #   plan: free
  #   region: oregon
  #   buildCommand: npm ci
  #   startCommand: npm start
  #   envVars:
  #     - key: NODE_VERSION
  #       value: "22"
  #     - key: BOT_WORKER
  #       value: "1"
