<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="csrf-token" content="{{CSRF}}" />
    <title>Create your account · StatusC0rd</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/register.js" defer></script>
  </head>
  <body class="auth" data-signup-enabled="{{SIGNUP_ENABLED}}">
    <main class="auth-card">
      <div class="brand brand-lg">
        <span class="brand-mark" aria-hidden="true">S</span>
        <span>StatusC0rd</span>
      </div>
      <p class="auth-sub">Your own card, on your own Discord profile.</p>

      <div id="alert" class="alert" role="alert" hidden></div>

      <form id="register-form" class="stack" method="post" action="/register">
        <input type="hidden" name="_csrf" value="{{CSRF}}" />
        <label class="field">
          <span>Name <small>— shown in the dashboard, optional</small></span>
          <input
            id="name"
            name="name"
            type="text"
            maxlength="60"
            autocomplete="nickname"
            placeholder="Sam"
          />
        </label>
        <label class="field">
          <span>Email</span>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            required
          />
          <small>This is your login. Nothing is sent to it — no verification mail.</small>
        </label>
        <label class="field">
          <span>Password <small>— at least 10 characters</small></span>
          <input
            id="password"
            name="password"
            type="password"
            minlength="10"
            autocomplete="new-password"
            required
          />
        </label>
        <label class="field">
          <span>Repeat password</span>
          <input
            id="confirm"
            name="confirm"
            type="password"
            minlength="10"
            autocomplete="new-password"
            required
          />
        </label>
        <button class="btn primary block" type="submit">Create account</button>
      </form>

      <p class="fineprint">
        Already have one? <a href="/login">Sign in</a>.
      </p>

      <footer class="auth-footer">
        <span>StatusC0rd v{{VERSION}}</span>
        <span class="auth-links">
          <a href="/guide">Setup guide</a>
          <a href="/welcome">What is this?</a>
        </span>
      </footer>
    </main>
  </body>
</html>
