<!doctype html><html><head><meta charset="utf-8"><title>StatusC0rd Login</title>
<style>
body{font-family:system-ui;background:#1e1f22;color:#dbdee1;display:flex;height:100vh;align-items:center;justify-content:center;margin:0}
form{background:#2b2d31;padding:32px;border-radius:12px;width:320px;display:flex;flex-direction:column;gap:12px}
h2{margin:0 0 8px}input,button{padding:10px;border-radius:8px;border:1px solid #1e1f22;font-size:14px}
button{background:#5865f2;color:#fff;border:none;cursor:pointer;font-weight:600}
.err{color:#fa777c;font-size:13px}
</style></head><body>
<form method="post" action="/login">
  <h2>StatusC0rd Dashboard</h2>
  <input name="key" type="password" placeholder="Dashboard key" autofocus>
  <button type="submit">Sign in</button>
</form>
<script>if(location.search.includes('error'))document.querySelector('form').insertAdjacentHTML('beforeend','<div class="err">Wrong key.</div>');</script>
</body></html>
