<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>{{PAGE_TITLE}}</title>
    <meta name="description" content="{{PAGE_DESCRIPTION}}" />
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="{{SITE_NAME}}" />
    <meta property="og:title" content="{{PAGE_TITLE}}" />
    <meta property="og:description" content="{{PAGE_DESCRIPTION}}" />
    {{{OG_IMAGE}}}
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/card.js" defer></script>
  </head>
  <body class="gate">
    <main class="gate-card">
      <div class="brand">{{{BRAND_HTML}}}</div>
      <article class="pv public-card" aria-label="activity card">
        <div class="pv-art">{{{ART_HTML}}}</div>
        <div class="pv-body">
          <div class="pv-type">{{TYPE_LABEL}}</div>
          <div class="pv-name">{{NAME}}</div>
          <div class="pv-line">{{DETAILS}}</div>
          <div class="pv-line">{{STATE_TEXT}}</div>
          <div class="pv-time" id="card-time" data-start="{{START_MS}}">{{TIME_TEXT}}</div>
          <div class="pv-buttons">{{{BUTTONS_HTML}}}</div>
        </div>
      </article>
      <p class="gate-note">Posted through {{{BRAND_HTML}}}</p>
      <p><a class="btn primary" href="/">Make your own</a></p>
    </main>
  </body>
</html>
